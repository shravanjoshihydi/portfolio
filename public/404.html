<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Shravan Joshi</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0A0B0D" />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0B0D'/%3E%3Ctext x='16' y='22' font-family='Inter,system-ui,sans-serif' font-size='16' font-weight='650' fill='%2335C08F' text-anchor='middle'%3ESJ%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    />
    <style>
      :root {
        --bg: #0a0b0d;
        --text: #e8ebef;
        --text-muted: #9ba3ae;
        --accent: #35c08f;
        --border-strong: #2c323a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 40px 20px;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }
      .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        letter-spacing: 0.08em;
        color: var(--accent);
        margin: 0 0 14px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.5rem, 5vw, 2rem);
        letter-spacing: -0.02em;
      }
      p.msg {
        margin: 0 auto 28px;
        max-width: 42ch;
        color: var(--text-muted);
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        padding: 11px 22px;
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        color: var(--text);
        text-decoration: none;
        font-size: 15px;
        transition: border-color 0.2s, color 0.2s;
      }
      a.btn:hover { border-color: rgba(53, 192, 143, 0.3); color: var(--accent); }
    </style>
  </head>
  <body>
    <div>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p class="msg">That URL doesn't exist on this site.</p>
      <a class="btn" href="/">Back to the site</a>
    </div>
  </body>
</html>
