  <body>
    <div id="root"></div>

    <!--
      Netlify detects forms by parsing the deployed HTML at build time, and the
      real form is rendered by React on the client. This hidden twin is what
      registers the "contact" form; the React form posts to it. Keep the field
      names in sync with src/components/Contact.tsx.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
